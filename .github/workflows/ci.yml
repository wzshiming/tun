name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Build without cgo
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-compile for unsupported and 32-bit targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build ./...
          GOOS=windows GOARCH=386 go vet ./...

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build e2e test binary
        if: runner.os != 'Windows'
        run: go test -c -race -o "$RUNNER_TEMP/tun-e2e.test" ./e2e
      - name: Build e2e test binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -c -race -o "$RUNNER_TEMP/tun-e2e.test.exe" ./e2e
      # Each run fails unless the tests it must run report PASS, so a test skipped by mistake cannot go unnoticed.
      - name: E2E unprivileged
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TUN_E2E=1 "$RUNNER_TEMP/tun-e2e.test" -test.v -test.timeout 6m | tee "$RUNNER_TEMP/tun-e2e-user.log"
          want=TestE2EHelper
          if [ "$RUNNER_OS" = macOS ]; then want="$want TestE2EBypassBindsUDPToIPv4DefaultInterface"; fi
          for t in $want; do
            grep -qF -- "--- PASS: $t (" "$RUNNER_TEMP/tun-e2e-user.log" || { echo "$t did not pass"; exit 1; }
          done
      - name: E2E root
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo -n env TUN_E2E=1 "$RUNNER_TEMP/tun-e2e.test" -test.v -test.timeout 6m | tee "$RUNNER_TEMP/tun-e2e-root.log"
          for t in TestE2ERoot TestE2EBypassBindsUDPToIPv4DefaultInterface; do
            grep -qF -- "--- PASS: $t (" "$RUNNER_TEMP/tun-e2e-root.log" || { echo "$t did not pass"; exit 1; }
          done
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TUN_E2E=1 TUN_E2E_RUNAS=1 "$RUNNER_TEMP/tun-e2e.test.exe" -test.v -test.timeout 6m | tee "$RUNNER_TEMP/tun-e2e.log"
          for t in TestE2EWindowsLocal TestE2EWindowsHelper TestE2EWindowsHelperRunas TestE2EWintunLoad \
            TestE2EBypassDefaultInterfaceIsUpAndNotLoopback TestE2EBypassBindsUDPToIPv4DefaultInterface; do
            grep -qF -- "--- PASS: $t (" "$RUNNER_TEMP/tun-e2e.log" || { echo "$t did not pass"; exit 1; }
          done
      - name: Network state
        if: always() && runner.os == 'Linux'
        run: |
          ip addr
          ip route
          ip -6 route
      - name: Network state
        if: always() && runner.os == 'macOS'
        run: |
          ifconfig
          netstat -rn
      - name: Network state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          route print
          ipconfig /all
